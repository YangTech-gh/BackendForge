apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-forge
  labels:
    app: backend-forge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-forge
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend-forge
    spec:
      containers:
      - name: app
        image: backend-forge:latest
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-forge
spec:
  selector:
    app: backend-forge
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
